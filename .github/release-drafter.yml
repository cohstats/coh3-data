name-template: 'v$RESOLVED_VERSION-'
tag-template: 'v$RESOLVED_VERSION-'

categories:
  - title: '🎮 Game Data Updates'
    label: 'data-update'
  - title: '🚀 Features'
    label: 'enhancement'
  - title: '🐛 Bug Fixes'
    label: 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'documentation'

autolabeler:
  - label: 'data-update'
    title:
      - '/^Update game data/i'
    branch:
      - '/^data-updates-version-/'
  - label: 'bug'
    title:
      - '/^fix/i'
  - label: 'enhancement'
    title:
      - '/^feat/i'
      - '/^add/i'
  - label: 'chore'
    title:
      - '/^chore/i'
      - '/^refactor/i'
      - '/^remove/i'
      - '/^move/i'

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'enhancement'
  patch:
    labels:
      - 'data-update'
      - 'bug'
      - 'chore'
  default: 'patch'

exclude-labels:
  - 'skip-changelog'

template: |
  ## Changes

  $CHANGES

  **Note:** This draft is generated automatically. Before publishing, edit the tag/title to match
  the game patch version convention used by this repo: `vMAJOR.MINOR.PATCH-REVISION`
  (e.g. `v2.5.2-1` = game patch 2.5.2, data revision 1). See the README's "Convention" section.
